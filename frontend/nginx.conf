server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # The React page
  location / {
    try_files $uri /index.html;
  }

  # Any request starting with /api goes to the backend container.
  # "backend" is the container's name, and Docker turns the name into an address.
  location /api/ {
    proxy_pass http://backend:4000;
    proxy_set_header Host $host;
    proxy_read_timeout 60s; # Gemini can take a few seconds
  }
}